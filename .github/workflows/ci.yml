name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate migration naming/versioning
        run: python backend/scripts/check_migrations.py

      - name: Run backend tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          SUPABASE_JWT_SECRET: ci-test-secret
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: ci-test-service-key
        run: pytest -q backend/tests

      - name: Run backend script tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          SUPABASE_JWT_SECRET: ci-test-secret
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: ci-test-service-key
        run: pytest -q backend/scripts

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-anon-key
        run: npm run build

  smoke-e2e:
    runs-on: ubuntu-latest
    needs: frontend-quality
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build app for smoke tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-anon-key
        run: npm run build

      - name: Run smoke tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-anon-key
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: npm run test:smoke
