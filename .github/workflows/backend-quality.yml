name: Backend Quality

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate migration naming/versioning
        run: python backend/scripts/check_migrations.py

      - name: Compile backend code
        run: python -m compileall -q backend/app

      - name: Run backend tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          SUPABASE_JWT_SECRET: ci-test-secret
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: ci-test-service-key
        run: python -m pytest backend/tests -q
